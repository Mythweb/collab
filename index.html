<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0" />
  <title>Collab</title>
  <link rel="stylesheet" href="assets/style.css?v=4" />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.19.0/dist/tabler-icons.min.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet" />
</head>
<body>

  <div class="page-bg">
    <div class="phone-wrap">
      <div class="phone">
        <div class="notch"></div>

        <div class="status-bar">
          <span class="time" id="js-time">9:41</span>
          <span class="status-icons">
            <i class="ti ti-signal-4g"></i>
            <i class="ti ti-wifi"></i>
            <i class="ti ti-battery-2"></i>
          </span>
        </div>

        <div class="screen-header">
          <p class="screen-date" id="js-date">Tuesday, May 27</p>
          <h1 class="screen-title">Ideas</h1>
        </div>

        <div class="rings-legend">
          <div class="legend-item">
            <span class="legend-dot" style="background:#A78BFA"></span>Alex
          </div>
          <div class="legend-item">
            <span class="legend-dot" style="background:#34D399"></span>Sam
          </div>
          <div class="legend-item">
            <span class="legend-ring"></span>unseen
          </div>
        </div>

        <div class="icon-grid" id="icon-grid"></div>

        <div class="dock">
          <div class="dock-inner"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- Idea viewer overlay -->
  <div class="overlay" id="idea-overlay" onclick="handleOverlayClick(event,'idea-overlay')">
    <div class="sheet" id="idea-sheet"></div>
  </div>


<script src="assets/app.js?v=5"></script>
</body>
</html>
